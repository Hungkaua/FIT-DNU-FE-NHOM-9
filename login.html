<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - bloghub</title>
    <!-- Nhúng file CSS -->
    <link rel="stylesheet" href="css/login.css">
    <!-- Nhúng icon FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

    <div class="login-split-container">
        <!-- Phần 2/3 Bên trái: Ảnh nền -->
        <div class="login-image-side"></div>
        <!-- Phần 1/3 Bên phải: Khu vực form phẳng -->
        <div class="login-form-side">
            <div class="login-box">
                
                <div class="login-header">
                    <!-- THÊM LOGO Ở ĐÂY: Sửa 'logo.png' thành tên file logo của bạn -->
                    <img src="media/img/image.png" alt="Logo" class="login-logo" onerror="this.style.display='none'">

                    <p>Đăng nhập vào hệ thống</p>
                </div>

                <form class="login-form">
                    <div class="input-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="Email của bạn" required>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Mật khẩu" required>
                    </div>

                    <div class="form-actions">
                        <label>
                            <input type="checkbox"> Nhớ mật khẩu
                        </label>
                        <a href="#" class="forgot-password">Quên mật khẩu?</a>
                    </div>

                    <button type="submit" class="login-btn">Đăng nhập</button>
                </form>
                <script type="module" src="js/login.js"></script>

                <div class="login-footer">
                    <p>Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
                    <div class="back-to-home">
                        <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ</a>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
