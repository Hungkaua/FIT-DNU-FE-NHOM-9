<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Duyệt bài viết</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        .admin-page {
            max-width: 1200px;
            margin: 80px auto 40px;
            padding: 20px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }
        .admin-header h1 {
            font-size: 28px;
            margin-bottom: 4px;
        }
        .admin-header p {
            color: #5b6369;
        }
        .admin-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            border-bottom: 2px solid #e6e8eb;
        }
        .admin-tab-btn {
            padding: 12px 20px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            font-weight: 600;
            cursor: pointer;
            color: #5b6369;
            transition: all 0.3s ease;
        }
        .admin-tab-btn.active {
            color: #0079D3;
            border-bottom-color: #0079D3;
        }
        .admin-tab-btn:hover {
            color: #0079D3;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .pending-list {
            display: grid;
            gap: 18px;
        }
        .pending-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
            padding: 22px;
            border: 1px solid #e6e8eb;
        }
        .pending-card h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }
        .pending-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
            color: #5b6369;
            font-size: 14px;
        }
        .pending-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }
        .pending-actions button {
            padding: 10px 18px;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-approve {
            background-color: #28a745;
            color: white;
        }
        .btn-approve:hover {
            background-color: #218838;
        }
        .btn-reject {
            background-color: #f44336;
            color: white;
        }
        .btn-reject:hover {
            background-color: #da190b;
        }
        .pending-empty {
            text-align: center;
            padding: 40px 20px;
            border: 1px dashed #cfd6dc;
            border-radius: 16px;
            background: #f8f9fb;
        }
    </style>
</head>
<body>
    <div class="admin-page">
        <div class="admin-header">
            <div>
                <h1><i class="fa-solid fa-shield-halved"></i> Bảng điều khiển Admin</h1>
                <p>Quản lý bài viết chờ duyệt và xét duyệt yêu cầu admin</p>
            </div>
            <div>
                <a href="index.html" class="btn-login">Trang chủ</a>
                <form id="serverNotificationForm" style="display:inline-block;margin-left:12px;">
                    <input id="serverNotifTitle" placeholder="Tiêu đề thông báo" style="padding:6px;border-radius:6px;border:1px solid #ccc;" />
                    <input id="serverNotifMessage" placeholder="Nội dung" style="padding:6px;border-radius:6px;border:1px solid #ccc;" />
                    <button type="submit" class="btn-submit">Gửi thông báo</button>
                </form>
            </div>
        </div>

        <div class="admin-tabs">
            <button class="admin-tab-btn active" data-tab="posts">📝 Duyệt bài viết</button>
            <button class="admin-tab-btn" data-tab="admins">👥 Duyệt yêu cầu admin</button>
        </div>

        <div id="posts" class="tab-content active">
            <div class="pending-list" id="pendingList"></div>
        </div>

        <div id="admins" class="tab-content">
            <div class="pending-list" id="adminRequestList"></div>
        </div>
    </div>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
