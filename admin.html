<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Bảng điều khiển</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
    <div class="admin-page">
        <div class="admin-header">
            <div class="admin-title-group">
                <h1><i class="fa-solid fa-shield-halved"></i> Bảng điều khiển Admin</h1>
                <p>Quản lý bài viết chờ duyệt và xét duyệt yêu cầu hệ thống</p>
            </div>
            
            <div class="admin-actions">
                <a href="index.html" class="btn-login"><i class="fa-solid fa-arrow-left"></i> Trở về Trang chủ</a>
                
                <form id="serverNotificationForm">
                    <input id="serverNotifTitle" placeholder="Tiêu đề thông báo..." required />
                    <div class="input-divider"></div>
                    <input id="serverNotifMessage" placeholder="Nhập nội dung..." required />
                    <button type="submit" class="btn-submit"><i class="fa-solid fa-paper-plane"></i> Phát sóng</button>
                </form>
            </div>
        </div>

        <div class="admin-tabs">
            <button class="admin-tab-btn active" data-tab="posts"><i class="fa-solid fa-file-signature"></i> Duyệt bài viết</button>
            <button class="admin-tab-btn" data-tab="admins"><i class="fa-solid fa-users-gear"></i> Duyệt yêu cầu Admin</button>
        </div>

        <div id="posts" class="tab-content active">
            <div class="pending-list" id="pendingList"></div>
        </div>

        <div id="admins" class="tab-content">
            <div class="pending-list" id="adminRequestList"></div>
        </div>
    </div>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
