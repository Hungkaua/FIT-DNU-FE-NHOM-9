<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - bloghub</title>
    
    <link rel="stylesheet" href="css/login.css">
    
    <link rel="stylesheet" href="css/forgot.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

    <div class="login-split-container">
        
        <div class="login-image-side"></div>

        <div class="login-form-side">
            <div class="login-box">
                
                <div class="login-header">
                    <img src="media/img/image.png" alt="Logo" class="login-logo" onerror="this.style.display='none'">
                    
                    <h2>Quên mật khẩu?</h2>
                    <p class="help-text">Đừng lo lắng! Hãy nhập địa chỉ email bạn đã sử dụng để đăng ký, chúng tôi sẽ gửi cho bạn một liên kết an toàn để đặt lại mật khẩu.</p>
                </div>

                <form class="login-form">
                    <div class="input-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="reset-email" placeholder="Nhập email của bạn" required>
                    </div>

                    <button type="submit" class="login-btn reset-btn">Gửi liên kết khôi phục</button>
                </form>

                <div class="login-footer">
                    <p>Nhớ ra mật khẩu rồi? <a href="login.html">Đăng nhập ngay</a></p>
                    <div class="back-to-home">
                        <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ</a>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
