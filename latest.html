<!DOCTYPE html>

<body>

    <header class="header">

            <div class="search-bar">

            <div class="header-actions">
                <a href="login.html" class="btn-login">Đăng nhập</a>
                <a href="register.html" class="btn-register">Đăng ký</a>
            </div>
        </div>
    </header>

    <div class="app-container">
        
        <aside class="sidebar">
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html"><i class="fa-solid fa-house"></i> Trang chủ</a></li>
                    <li><a href="popular.html"><i class="fa-solid fa-fire"></i> Phổ biến</a></li>
