<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Blog</title>
</head>
<body>

<header class="header">

    <div class="logo">
    <a href="index.html" class="home-link">My Blog</a>
</div>
<div class="header-actions">

        <a href="register.html" class="login-btn">
            <i class="fa-solid fa-user"></i>
            Đăng ký
        </a>

    </div>
</header>
<nav class="navbar">
        <a href="#" class="active">Home</a>
        <a href="#">About</a>
        <a href="#">Categories</a>
        <a href="#">Contact</a>
    </nav>


<div class="container">

    <main class="main-content">

        <div id="post-container"></div>

        <section class="comment-section">

            <h2>Bình Luận</h2>

            <div class="comment-form">

                <input
                type="text"
                id="comment-username"
                placeholder="Tên của bạn">

                <textarea
                id="comment-input"
                placeholder="Viết bình luận..."></textarea>

                <button id="comment-btn">
                    Gửi
                </button>

            </div>

            <div id="comment-list"></div>

        </section>

    </main>

    <aside class="sidebar">

        <div class="sidebar-box">

            <h3>Bài viết mới</h3>

            <ul>
                <li>Khám phá ẩm thực Hà Nội</li>
                <li>Kinh nghiệm trekking Đà Nẵng</li>
                <li>Mùa hoa cải vàng ở Mộc Châu</li>
            </ul>

        </div>

        <div class="sidebar-box">

            <h3>Chủ đề nổi bật</h3>

            <ul>
                <li>Du lịch</li>
                <li>Ẩm thực</li>
                <li>Phong cách sống</li>
            </ul>

        </div>

    </aside>

</div>

<script type="module" src="./js/main.js"></script>
<script type="module" src="./js/comments.js"></script>

</body>
</html>
