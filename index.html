<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diễn Đàn Viễn Tưởng</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>

    <header class="header">
        <div class="header-content">
            
            <a href="index.html" class="logo">
                <img src="media/img/image.png" alt="Logo Diễn Đàn" class="logo-img" onerror="this.style.display='none'">
                <span>DIỄN ĐÀN VIỄN TƯỞNG</span>
            </a>

            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Tìm kiếm...">
            </div>

            <div class="header-actions">
                <div id="userInfo" class="user-info hidden">
                    <img id="userAvatar" src="https://via.placeholder.com/32" alt="Avatar" class="user-avatar">
                    <span id="userName" class="user-name"></span>
                    <button id="logoutButton" class="btn-logout">Đăng xuất</button>
                </div>
                
                <a href="./login.html" class="btn-login">Đăng nhập</a>
                <a href="./register.html" class="btn-register">Đăng ký</a>
            </div>
            
        </div>
    </header>

    <div class="app-container">
        
        <aside class="sidebar">
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html" class="active"><i class="fa-solid fa-house"></i> Trang chủ</a></li>
                    <li><a href="popular.html"><i class="fa-solid fa-fire"></i> Phổ biến</a></li>
                    <li><a href="latest.html"><i class="fa-solid fa-certificate"></i> Mới nhất</a></li>
                    <li><a href="discover.html"><i class="fa-solid fa-compass"></i> Khám phá</a></li>
                </ul>

                <div class="nav-divider"></div>
                <h4 class="nav-title">TÀI NGUYÊN</h4>
                
                <ul>
                    <li><a href="#"><i class="fa-solid fa-circle-info"></i> Về chúng tôi</a></li>
                    <li><a href="#"><i class="fa-solid fa-bullhorn"></i> Quảng cáo</a></li>
                    <li><a href="#"><i class="fa-solid fa-code"></i> Phát triển</a></li>
                    <li><a href="#"><i class="fa-solid fa-circle-question"></i> Trợ giúp</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            
            <div class="post-toolbar">
                <button id="openCreatePost" class="btn-create-post"><i class="fa-solid fa-plus"></i> Tạo Bài</button>
            </div>

            <div id="createPostCard" class="create-post-card hidden">
                <h3>Tạo bài viết mới</h3>
                <form id="createPostForm" class="create-post-form">
                    <div class="form-row">
                        <input id="postCommunity" type="text" placeholder="Chủ đề (ví dụ: r/Anime)" required>
                        <input id="postTitle" type="text" placeholder="Tiêu đề bài viết" required>
                    </div>
                    <textarea id="postContent" placeholder="Nội dung bài viết..." rows="4" required></textarea>
                    <div class="form-row">
                        <input id="postImage" type="url" placeholder="URL ảnh (tùy chọn)">
                        <button type="submit" class="btn-submit">Đăng bài</button>
                    </div>
                </form>
                <p class="note">Bài viết mới sẽ được lưu vào MockAPI và hiển thị ngay.</p>
            </div>

            <div class="feed-filters">
                <button class="filter-btn active"><i class="fa-solid fa-rocket"></i> Tốt nhất</button>
                <button class="filter-btn"><i class="fa-solid fa-certificate"></i> Mới nhất</button>
                <button class="filter-btn"><i class="fa-solid fa-fire"></i> Bình luận nhiều</button>
            </div>

            <div class="post-feed" id="post-feed-container">
                
                <div class="empty-state">
                    <i class="fa-regular fa-folder-open"></i>
                    <p>Chưa có bài viết nào.<br>Hãy là người đầu tiên tạo bài viết!</p>
                </div>

            </div>
            
        </main>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
